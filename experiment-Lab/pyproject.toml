[project]
name = "experiment-lab"
version = "0.1.0"
description = "In-lab version of the abstract reasoning experiment"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "psychopy==2024.1.4",
    "pypi-search",
    "wxpython>=4.2.3",
    "tables>=3.10.0",
    "pandas>=2.2.2",
    # Pinned: newer PyQt6/Qt6 (6.11.x, uv's default pick) has a macOS Cocoa
    # platform-plugin loading regression on this machine. 6.7.x is the last
    # version confirmed to actually open a window here.
    "pyqt6==6.7.1",
    "ipykernel>=6.29.4",
    "icecream>=2.1.3",
    "tqdm>=4.66.4",
    "screeninfo>=0.8.1",
    "tabulate>=0.9.0",
    "pyperclip>=1.9.0",
    "pendulum>=3.0.0",
    "loguru>=0.7.2",
    "rich>=13.7.1",
]

# NOTE: pylink (SR-Research's EyeLink SDK) is intentionally NOT listed here.
# Its package index (https://pypi.sr-research.com) doesn't serve responses that
# uv's resolver accepts (same underlying issue tripped up newer pip versions
# too). Install it manually after `uv sync`, directly into this project's venv:
#   .venv/bin/pip install --index-url https://pypi.sr-research.com --no-cache-dir sr-research-pylink

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
pypi-search = { path = "vendor/pypi-search-stub" }
